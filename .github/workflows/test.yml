name: test
on: push
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go:
          - "1.22"
          - "1.23"
          - "1.24"
          - "1.25"
          - "1.26"
    name: Go ${{ matrix.go }} test
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.1.0
        with:
          go-version: ${{ matrix.go }}
      - run: go test -race .
